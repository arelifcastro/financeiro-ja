<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para compilar JSX no navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen overflow-hidden flex items-center justify-center">
    
    <div id="root" class="h-full w-full flex items-center justify-center"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdM0kTzE1f-D4RmaxmQ-CDmVXzK5W4748",
            authDomain: "financas-casal-jordanareli.firebaseapp.com",
            projectId: "financas-casal-jordanareli",
            storageBucket: "financas-casal-jordanareli.firebasestorage.app",
            messagingSenderId: "1091820122865",
            appId: "1:1091820122865:web:f0d18cd512fab369182f50"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseAPI = {
            auth: getAuth(app),
            db: getFirestore(app),
            signInAnonymously,
            onAuthStateChanged,
            doc, setDoc, onSnapshot, collection,
            appId: "1_1091820122865_web_f0d18cd512fab369182f50"
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const PESSOA1 = { id: 'p1', name: 'Jordan', color: 'bg-blue-500', avatar: 'A' };
        const PESSOA2 = { id: 'p2', name: 'Areli', color: 'bg-pink-500', avatar: 'B' };
        const CASAL = { id: 'casal', name: 'Casal', color: 'bg-purple-600', avatar: '👥' };

        const CATEGORIAS = [
            { id: 'cat_moradia', name: 'Moradia', icon: '🏠', color: 'bg-indigo-500' },
            { id: 'cat_contas', name: 'Contas da Casa', icon: '📄', color: 'bg-orange-500' },
            { id: 'cat_mercado', name: 'Mercado', icon: '🛒', color: 'bg-green-500' },
            { id: 'cat_transporte', name: 'Transporte', icon: '🚗', color: 'bg-slate-500' },
            { id: 'cat_saude', name: 'Saúde', icon: '💊', color: 'bg-red-500' },
            { id: 'cat_educacao', name: 'Educação', icon: '📚', color: 'bg-blue-400' },
            { id: 'cat_lazer', name: 'Lazer', icon: '🎉', color: 'bg-yellow-500' },
            { id: 'cat_restaurante', name: 'Restaurantes', icon: '🍽️', color: 'bg-orange-400' },
            { id: 'cat_assinaturas', name: 'Assinaturas', icon: '📺', color: 'bg-purple-500' },
            { id: 'cat_roupas', name: 'Roupas', icon: '👕', color: 'bg-pink-400' },
            { id: 'cat_pets', name: 'Pets', icon: '🐶', color: 'bg-amber-600' },
            { id: 'cat_impostos', name: 'Impostos/Taxas', icon: '🏛️', color: 'bg-slate-700' },
            { id: 'cat_salario', name: 'Salário', icon: '💰', color: 'bg-green-600', type: 'income' },
            { id: 'cat_renda_extra', name: 'Renda Extra', icon: '💸', color: 'bg-emerald-500', type: 'income' },
            { id: 'cat_outros', name: 'Outros', icon: '✨', color: 'bg-gray-400' }
        ];

        const INITIAL_ACCOUNTS = [
            { id: 'acc_nup1', ownerId: 'p1', name: 'Nubank Conta', bank: 'Nubank', balance: 150000, type: 'checking', color: 'bg-purple-700' },
            { id: 'acc_nup2', ownerId: 'p2', name: 'Nubank Conta', bank: 'Nubank', balance: 230000, type: 'checking', color: 'bg-purple-700' },
            { id: 'acc_bra', ownerId: 'casal', name: 'Bradesco (CC)', bank: 'Bradesco', balance: 450000, type: 'checking', color: 'bg-red-600' },
            { id: 'acc_cai', ownerId: 'casal', name: 'Caixa', bank: 'Caixa', balance: 1200000, type: 'savings', color: 'bg-blue-600' },
            { id: 'acc_din', ownerId: 'casal', name: 'Carteira', bank: 'Dinheiro', balance: 35000, type: 'cash', color: 'bg-emerald-600' }
        ];

        const INITIAL_CARDS = [
            { id: 'card_nup1', ownerId: 'p1', name: 'Nubank Jordan', limit: 500000, closingDay: 25, dueDay: 2, accountId: 'acc_nup1', color: 'bg-purple-700' },
            { id: 'card_nup2', ownerId: 'p2', name: 'Nubank Areli', limit: 800000, closingDay: 20, dueDay: 27, accountId: 'acc_nup2', color: 'bg-purple-700' },
            { id: 'card_bra', ownerId: 'casal', name: 'Bradesco', limit: 1200000, closingDay: 5, dueDay: 12, accountId: 'acc_bra', color: 'bg-red-600' },
            { id: 'card_cai', ownerId: 'casal', name: 'Caixa', limit: 300000, closingDay: 10, dueDay: 17, accountId: 'acc_cai', color: 'bg-blue-600' }
        ];

        const INITIAL_TRANSACTIONS = [
            { id: 't1', type: 'income', amount: 800000, description: 'Salário', date: new Date().toISOString().split('T')[0], categoryId: 'cat_salario', sourceId: 'acc_bra', sourceType: 'account', ownerId: 'p1', status: 'paid' },
            { id: 't2', type: 'expense', amount: 12000, description: 'Luz', date: new Date().toISOString().split('T')[0], categoryId: 'cat_contas', sourceId: 'acc_bra', sourceType: 'account', ownerId: 'casal', splitType: '50/50', paidById: 'p1', status: 'paid' },
            { id: 't3', type: 'expense', amount: 35000, description: 'Supermercado', date: new Date().toISOString().split('T')[0], categoryId: 'cat_mercado', sourceId: 'card_bra', sourceType: 'card', ownerId: 'casal', splitType: '50/50', paidById: 'casal', status: 'pending' },
        ];

        const formatCurrency = (cents) => {
            return (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        const parseCurrencyString = (str) => {
            const digits = str.replace(/\D/g, '');
            return parseInt(digits, 10) || 0;
        };

        const formatDate = (isoString) => {
            if (!isoString) return '';
            const [y, m, d] = isoString.split('-');
            return `${d}/${m}/${y}`;
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const getFaturaCycle = (dateStr, closingDay) => {
            const date = new Date(dateStr + 'T00:00:00');
            let month = date.getMonth() + 1;
            let year = date.getFullYear();
            
            if (date.getDate() > closingDay) {
                month += 1;
                if (month > 12) {
                    month = 1;
                    year += 1;
                }
            }
            return `${year}-${String(month).padStart(2, '0')}`;
        };

        function FinancasCasalApp() {
            const [globalFilter, setGlobalFilter] = useState('casal');
            const [currentTab, setCurrentTab] = useState('home');
            
            const [user, setUser] = useState(null);
            const [accounts, setAccounts] = useState(INITIAL_ACCOUNTS);
            const [cards, setCards] = useState(INITIAL_CARDS);
            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
            
            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [authError, setAuthError] = useState(false);
            const [dbError, setDbError] = useState(false);
            const [firebaseReady, setFirebaseReady] = useState(false);

            useEffect(() => {
                const checkFb = setInterval(() => {
                    if (window.firebaseAPI) {
                        clearInterval(checkFb);
                        setFirebaseReady(true);
                        initializeFirebaseAuth(window.firebaseAPI);
                    }
                }, 100);
                return () => clearInterval(checkFb);
            }, []);

            const initializeFirebaseAuth = async (fb) => {
                try {
                    await fb.signInAnonymously(fb.auth);
                    setAuthError(false);
                } catch (error) {
                    if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                        setAuthError(true);
                    }
                }

                fb.onAuthStateChanged(fb.auth, (currentUser) => {
                    setUser(currentUser);
                });
            };

            useEffect(() => {
                if (!user || !window.firebaseAPI) return;
                
                const { db, collection, onSnapshot, appId } = window.firebaseAPI;
                const txRef = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');
                
                const unsubscribe = onSnapshot(txRef, (snapshot) => {
                    setDbError(false);
                    const loadedTxs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (loadedTxs.length > 0) {
                        setTransactions(loadedTxs);
                    }
                }, (error) => {
                    if (error.code === 'permission-denied' || (error.message && error.message.includes('Missing or insufficient permissions'))) {
                        setDbError(true);
                    }
                });
                return () => unsubscribe();
            }, [user, firebaseReady]);

            const [currentViewMonth, setCurrentViewMonth] = useState(() => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            });

            const getOwnerConfig = (id) => [PESSOA1, PESSOA2, CASAL].find(p => p.id === id) || CASAL;
            
            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    const tMonth = t.date.substring(0, 7);
                    if (tMonth !== currentViewMonth) return false;
                    
                    if (globalFilter === 'casal') return true; 
                    return t.ownerId === globalFilter || t.ownerId === 'casal';
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [transactions, globalFilter, currentViewMonth]);

            const dashboardStats = useMemo(() => {
                let income = 0;
                let expense = 0;
                let pendingCards = 0;

                filteredTransactions.forEach(t => {
                    let factor = 1;
                    if (t.ownerId === 'casal' && globalFilter !== 'casal') factor = 0.5;

                    if (t.type === 'income') income += t.amount * factor;
                    if (t.type === 'expense' && t.sourceType === 'account') expense += t.amount * factor;
                    if (t.type === 'expense' && t.sourceType === 'card') pendingCards += t.amount * factor;
                });

                return { income, expense, pendingCards, balance: income - expense };
            }, [filteredTransactions, globalFilter]);

            const acertoDeContas = useMemo(() => {
                let p2OwesP1 = 0; 
                
                transactions.forEach(t => {
                    if (t.date.substring(0, 7) !== currentViewMonth) return;
                    if (t.ownerId !== 'casal' || t.type !== 'expense') return;

                    let payer = t.paidById;
                    if (!payer) {
                        if (t.sourceType === 'account') {
                            const acc = accounts.find(a => a.id === t.sourceId);
                            payer = acc ? acc.ownerId : 'casal';
                        } else {
                            const card = cards.find(c => c.id === t.sourceId);
                            payer = card ? card.ownerId : 'casal';
                        }
                    }

                    if (payer === 'casal') return;

                    const half = Math.round(t.amount / 2);
                    if (payer === 'p1') p2OwesP1 += half;
                    if (payer === 'p2') p2OwesP1 -= half;
                });

                return p2OwesP1;
            }, [transactions, currentViewMonth, accounts, cards]);

            const changeMonth = (offset) => {
                const [y, m] = currentViewMonth.split('-').map(Number);
                let newM = m + offset;
                let newY = y;
                if (newM > 12) { newM = 1; newY++; }
                if (newM < 1) { newM = 12; newY--; }
                setCurrentViewMonth(`${newY}-${String(newM).padStart(2, '0')}`);
            };

            return (
                <div className="w-full max-w-6xl h-full md:h-[92vh] md:rounded-3xl flex flex-col md:flex-row bg-slate-50 font-sans shadow-2xl relative text-slate-800 border border-slate-200 overflow-hidden">
                    
                    {/* Barra Lateral para Computador (Sidebar) */}
                    <div className="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 p-6 justify-between z-20 shrink-0">
                        <div>
                            <div className="flex items-center space-x-3 mb-8">
                                <div className="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md shadow-indigo-600/30">
                                    ❤️
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-900 leading-tight">Finanças Casal</h1>
                                    <p className="text-xs text-slate-400">Gestão a dois</p>
                                </div>
                            </div>

                            <nav className="space-y-1.5">
                                <button onClick={() => setCurrentTab('home')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition-colors ${currentTab === 'home' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50'}`}>
                                    <i className="fa-solid fa-house w-5"></i><span>Início</span>
                                </button>
                                <button onClick={() => setCurrentTab('transacoes')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition-colors ${currentTab === 'transacoes' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50'}`}>
                                    <i className="fa-solid fa-file-invoice w-5"></i><span>Lançamentos</span>
                                </button>
                                <button onClick={() => setCurrentTab('cartoes')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition-colors ${currentTab === 'cartoes' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50'}`}>
                                    <i className="fa-solid fa-credit-card w-5"></i><span>Cartões</span>
                                </button>
                            </nav>
                        </div>

                        <div>
                            <button onClick={() => setIsTxModalOpen('expense')} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition-transform active:scale-95">
                                <i className="fa-solid fa-plus"></i>
                                <span>Novo Lançamento</span>
                            </button>
                        </div>
                    </div>

                    {/* Conteúdo Principal */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        
                        {/* Header Superior */}
                        <div className="bg-white px-6 pt-5 pb-4 border-b border-slate-200 z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold text-slate-900">
                                    Olá, {globalFilter === 'casal' ? 'Casal' : getOwnerConfig(globalFilter).name}!
                                </h1>
                                <p className="text-xs md:text-sm text-slate-500 font-medium">Controle integrado e inteligente</p>
                            </div>

                            <div className="flex items-center justify-between md:justify-end gap-3">
                                {/* Seletor de Perfil (Filtro Global) */}
                                <div className="flex bg-slate-100 p-1 rounded-full space-x-1">
                                    {[PESSOA1, CASAL, PESSOA2].map(p => (
                                        <button
                                            key={p.id}
                                            onClick={() => setGlobalFilter(p.id)}
                                            className={`px-3 py-1.5 rounded-full flex items-center space-x-1.5 text-xs font-bold transition-all ${
                                                globalFilter === p.id 
                                                    ? `${p.color} text-white shadow-md transform scale-105` 
                                                    : 'text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            <span>{p.avatar}</span>
                                            <span className="hidden sm:inline">{p.name}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Seletor de Mês */}
                                <div className="flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                                    <button onClick={() => changeMonth(-1)} className="p-1 text-slate-400 hover:text-slate-800"><i className="fa-solid fa-chevron-left text-xs"></i></button>
                                    <span className="font-semibold text-xs md:text-sm capitalize whitespace-nowrap">
                                        {new Date(currentViewMonth + '-02').toLocaleString('pt-BR', { month: 'short', year: 'numeric' })}
                                    </span>
                                    <button onClick={() => changeMonth(1)} className="p-1 text-slate-400 hover:text-slate-800"><i className="fa-solid fa-chevron-right text-xs"></i></button>
                                </div>
                            </div>
                        </div>

                        {/* Avisos do Sistema */}
                        {(authError || dbError) && (
                            <div className="bg-amber-50 border-b border-amber-200 text-amber-800 px-6 py-2.5 text-xs flex items-center justify-between shrink-0">
                                <span className="flex items-center">
                                    <i className="fa-solid fa-circle-exclamation mr-2 text-base"></i>
                                    {authError ? "Ative o login Anônimo no console do Firebase." : "Verifique as regras de segurança do Firestore no console."}
                                </span>
                            </div>
                        )}

                        {/* Área de Scroll Central */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 pb-28 md:pb-8 hide-scrollbar">
                            <div className="max-w-4xl mx-auto space-y-6">
                                
                                {/* TAB: HOME */}
                                {currentTab === 'home' && (
                                    <div className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {/* Saldo Principal */}
                                            <div className="bg-gradient-to-br from-purple-800 to-indigo-900 rounded-3xl p-6 text-white shadow-lg relative overflow-hidden md:col-span-3">
                                                <div className="absolute top-0 right-0 opacity-10">
                                                    <i className="fa-solid fa-chart-pie text-[140px] -mr-8 -mt-8 block"></i>
                                                </div>
                                                <p className="text-purple-200 text-sm font-medium mb-1">Saldo Líquido em Contas</p>
                                                <h2 className="text-3xl md:text-4xl font-bold mb-6">
                                                    {formatCurrency(dashboardStats.balance)}
                                                </h2>
                                                
                                                <div className="grid grid-cols-2 gap-4 border-t border-purple-700/50 pt-4 max-w-md">
                                                    <div>
                                                        <div className="flex items-center text-emerald-400 text-xs font-semibold mb-1">
                                                            <i className="fa-solid fa-circle-arrow-down mr-1"></i> RECEITAS
                                                        </div>
                                                        <p className="font-bold text-base md:text-lg">{formatCurrency(dashboardStats.income)}</p>
                                                    </div>
                                                    <div>
                                                        <div className="flex items-center text-red-300 text-xs font-semibold mb-1">
                                                            <i className="fa-solid fa-circle-arrow-up mr-1"></i> DESPESAS
                                                        </div>
                                                        <p className="font-bold text-base md:text-lg">{formatCurrency(dashboardStats.expense)}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Widget: Acerto de Contas */}
                                        {globalFilter === 'casal' && (
                                            <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 flex items-center justify-between">
                                                <div className="flex items-center space-x-4">
                                                    <div className="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl shrink-0">
                                                        <i className="fa-solid fa-scale-balanced"></i>
                                                    </div>
                                                    <div>
                                                        <h3 className="text-sm font-bold text-slate-800">Acerto de Contas do Mês</h3>
                                                        <p className="text-xs text-slate-500">Divisão automática de despesas conjuntas</p>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    {acertoDeContas === 0 ? (
                                                        <span className="text-emerald-600 font-bold text-sm bg-emerald-50 px-3 py-1.5 rounded-full">Tudo quite! ✅</span>
                                                    ) : acertoDeContas > 0 ? (
                                                        <div className="flex flex-col items-end">
                                                            <span className="text-xs text-slate-500">{PESSOA2.name} deve transferir:</span>
                                                            <span className="font-bold text-pink-600 text-base">{formatCurrency(acertoDeContas)} para {PESSOA1.name}</span>
                                                        </div>
                                                    ) : (
                                                        <div className="flex flex-col items-end">
                                                            <span className="text-xs text-slate-500">{PESSOA1.name} deve transferir:</span>
                                                            <span className="font-bold text-blue-600 text-base">{formatCurrency(Math.abs(acertoDeContas))} para {PESSOA2.name}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}

                                        {/* Lançamentos Recentes */}
                                        <div>
                                            <div className="flex justify-between items-center mb-3 px-1">
                                                <h3 className="font-bold text-slate-800 text-base">Últimos Lançamentos</h3>
                                                <button onClick={() => setCurrentTab('transacoes')} className="text-xs text-indigo-600 font-semibold hover:underline">Ver todos</button>
                                            </div>
                                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                                {filteredTransactions.slice(0, 5).map(t => <TransactionRow key={t.id} t={t} />)}
                                                {filteredTransactions.length === 0 && (
                                                    <p className="p-8 text-center text-slate-400 text-sm">Nenhum lançamento registrado neste mês.</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {currentTab === 'transacoes' && (
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center px-1">
                                            <h2 className="text-lg font-bold text-slate-800">Todos os Lançamentos</h2>
                                            <button onClick={() => setIsTxModalOpen('expense')} className="md:hidden bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow">Novo</button>
                                        </div>
                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                            {filteredTransactions.map(t => <TransactionRow key={t.id} t={t} />)}
                                            {filteredTransactions.length === 0 && (
                                                <p className="p-12 text-center text-slate-400 text-sm">Vazio.</p>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {currentTab === 'cartoes' && (
                                    <div className="space-y-5">
                                        <h2 className="text-lg font-bold text-slate-800 px-1">Cartões de Crédito</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {cards.filter(c => globalFilter === 'casal' || c.ownerId === globalFilter || c.ownerId === 'casal').map(card => {
                                                let totalFatura = 0;
                                                transactions.forEach(t => {
                                                    if (t.sourceType === 'card' && t.sourceId === card.id) {
                                                        const cycle = getFaturaCycle(t.date, card.closingDay);
                                                        if (cycle === currentViewMonth) totalFatura += t.amount;
                                                    }
                                                });

                                                return (
                                                    <div key={card.id} className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm relative overflow-hidden flex flex-col justify-between">
                                                        <div className={`absolute top-0 left-0 w-1.5 h-full ${card.color}`}></div>
                                                        <div>
                                                            <div className="flex justify-between items-start mb-3">
                                                                <div>
                                                                    <h3 className="font-bold text-slate-800 flex items-center">
                                                                        <i className="fa-solid fa-credit-card mr-2 text-slate-400"></i> {card.name}
                                                                    </h3>
                                                                    <p className="text-xs text-slate-500 mt-0.5">Vencimento dia {card.dueDay} • Fechamento dia {card.closingDay}</p>
                                                                </div>
                                                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${getOwnerConfig(card.ownerId).color} text-white`}>
                                                                    {getOwnerConfig(card.ownerId).name}
                                                                </span>
                                                            </div>
                                                            <div className="my-4">
                                                                <p className="text-xs text-slate-400 uppercase tracking-wider font-semibold mb-1">Fatura Atual</p>
                                                                <p className="text-3xl font-bold text-slate-800">{formatCurrency(totalFatura)}</p>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-2">
                                                                <div className={`h-full ${card.color}`} style={{ width: `${Math.min((totalFatura / card.limit) * 100, 100)}%` }}></div>
                                                            </div>
                                                            <div className="flex justify-between text-xs text-slate-500 font-medium">
                                                                <span>Limite: {formatCurrency(card.limit)}</span>
                                                                <span>Disp: {formatCurrency(card.limit - totalFatura)}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}

                            </div>
                        </div>

                        {/* Barra Inferior para Mobile */}
                        <div className="md:hidden bg-white border-t border-slate-200 absolute bottom-0 w-full z-20 pb-safe">
                            <div className="flex justify-around items-center p-3">
                                <button onClick={() => setCurrentTab('home')} className={`flex flex-col items-center p-2 ${currentTab==='home' ? 'text-indigo-600' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-house text-xl mb-1"></i>
                                    <span className="text-[10px] font-semibold">Início</span>
                                </button>
                                <button onClick={() => setCurrentTab('transacoes')} className={`flex flex-col items-center p-2 ${currentTab==='transacoes' ? 'text-indigo-600' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-file-invoice text-xl mb-1"></i>
                                    <span className="text-[10px] font-semibold">Lançamentos</span>
                                </button>
                                
                                <div className="relative -top-6">
                                    <button 
                                        onClick={() => setIsTxModalOpen('expense')}
                                        className="bg-indigo-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-indigo-600/30 border-4 border-slate-50 transform transition active:scale-95"
                                    >
                                        <i className="fa-solid fa-plus text-2xl"></i>
                                    </button>
                                </div>

                                <button onClick={() => setCurrentTab('cartoes')} className={`flex flex-col items-center p-2 ${currentTab==='cartoes' ? 'text-indigo-600' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-credit-card text-xl mb-1"></i>
                                    <span className="text-[10px] font-semibold">Cartões</span>
                                </button>
                            </div>
                        </div>

                    </div>

                    {/* Modal de Nova Transação */}
                    {isTxModalOpen && (
                        <TransactionModal 
                            onClose={() => setIsTxModalOpen(false)}
                            onSave={async (tx) => {
                                if (user && window.firebaseAPI) {
                                    try {
                                        const { db, doc, setDoc, appId } = window.firebaseAPI;
                                        const txRef = doc(db, 'artifacts', appId, 'public', 'data', 'transactions', tx.id);
                                        await setDoc(txRef, tx);
                                        setDbError(false);
                                    } catch (error) {
                                        setDbError(true);
                                        setTransactions(prev => [...prev, tx]); 
                                    }
                                } else {
                                    setTransactions(prev => [...prev, tx]);
                                }
                                setIsTxModalOpen(false);
                            }}
                            accounts={accounts}
                            cards={cards}
                            initialType={typeof isTxModalOpen === 'string' ? isTxModalOpen : 'expense'}
                        />
                    )}
                </div>
            );

            function TransactionRow({ t }) {
                const cat = CATEGORIAS.find(c => c.id === t.categoryId) || CATEGORIAS[CATEGORIAS.length - 1];
                const isIncome = t.type === 'income';
                const owner = getOwnerConfig(t.ownerId);

                return (
                    <div className="flex items-center p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                        <div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-white ${cat.color} shadow-sm shrink-0`}>
                            <span className="text-lg">{cat.icon}</span>
                        </div>
                        
                        <div className="ml-3 flex-1 overflow-hidden">
                            <p className="font-semibold text-slate-800 text-sm truncate">{t.description}</p>
                            <div className="flex items-center text-xs text-slate-500 mt-0.5 space-x-2">
                                <span>{formatDate(t.date)}</span>
                                <span>•</span>
                                <span className="truncate">{cat.name}</span>
                            </div>
                        </div>

                        <div className="flex flex-col items-end shrink-0 ml-2">
                            <span className={`font-bold text-sm ${isIncome ? 'text-emerald-600' : 'text-slate-800'}`}>
                                {isIncome ? '+' : '-'}{formatCurrency(t.amount)}
                            </span>
                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold mt-1 ${owner.color} text-white`}>
                                {owner.name}
                            </span>
                        </div>
                    </div>
                );
            }

            function TransactionModal({ onClose, onSave, accounts, cards, initialType }) {
                const [type, setType] = useState(initialType);
                const [amountStr, setAmountStr] = useState('0,00');
                const [description, setDescription] = useState('');
                const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
                const [categoryId, setCategoryId] = useState('');
                const [ownerId, setOwnerId] = useState('casal');
                const [source, setSource] = useState('');

                const isExpense = type === 'expense';
                const isIncome = type === 'income';

                const handleAmountChange = (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    if (val === '') val = '0';
                    const num = parseInt(val, 10);
                    setAmountStr((num / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                };

                const handleSave = () => {
                    const amount = parseCurrencyString(amountStr);
                    if (amount <= 0 || !description || !categoryId || !source) {
                        alert("Preencha todos os campos obrigatórios"); 
                        return;
                    }

                    const isCard = cards.some(c => c.id === source);
                    const newTx = {
                        id: generateId(), type, amount, description, date, categoryId, 
                        sourceId: source, sourceType: isCard ? 'card' : 'account',
                        ownerId, status: isCard ? 'pending' : 'paid',
                        paidById: ownerId === 'casal' ? (isCard ? cards.find(c=>c.id===source).ownerId : accounts.find(a=>a.id===source).ownerId) : null
                    };
                    onSave(newTx);
                };

                return (
                    <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                            <div className="flex justify-between items-center p-5 border-b border-slate-100">
                                <h2 className="text-lg font-bold text-slate-800">Novo Lançamento</h2>
                                <button onClick={onClose} className="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div className="p-6 overflow-y-auto hide-scrollbar space-y-4">
                                <div className="flex bg-slate-100 p-1 rounded-xl">
                                    <button onClick={() => setType('expense')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${type === 'expense' ? 'bg-white shadow-sm text-red-600' : 'text-slate-500'}`}>Despesa</button>
                                    <button onClick={() => setType('income')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${type === 'income' ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-500'}`}>Receita</button>
                                </div>
                                
                                <div className="text-center py-2">
                                    <label className="text-xs text-slate-400 font-semibold uppercase mb-1 block">Valor</label>
                                    <div className="flex items-center justify-center text-3xl md:text-4xl font-bold text-slate-800">
                                        <span className="text-xl mr-1 text-slate-400">R$</span>
                                        <input type="text" inputMode="numeric" value={amountStr} onChange={handleAmountChange} className="bg-transparent border-none text-center outline-none w-full max-w-[220px]"/>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Descrição</label>
                                    <input type="text" placeholder="Ex: Supermercado Mensal" value={description} onChange={e => setDescription(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500"/>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Data</label>
                                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">De quem?</label>
                                        <select value={ownerId} onChange={e => setOwnerId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500 appearance-none">
                                            <option value="casal">Casal (Dividir)</option>
                                            <option value="p1">{PESSOA1.name}</option>
                                            <option value="p2">{PESSOA2.name}</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Categoria</label>
                                    <select value={categoryId} onChange={e => setCategoryId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500 appearance-none">
                                        <option value="">Selecione...</option>
                                        {CATEGORIAS.filter(c => isIncome ? c.type === 'income' : c.type !== 'income').map(c => (
                                            <option key={c.id} value={c.id}>{c.icon} {c.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">{isExpense ? 'Forma de Pagamento' : 'Onde recebeu?'}</label>
                                    <select value={source} onChange={e => setSource(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500 appearance-none">
                                        <option value="">Selecione...</option>
                                        <optgroup label="Contas">
                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                        </optgroup>
                                        {isExpense && <optgroup label="Cartões de Crédito">
                                            {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </optgroup>}
                                    </select>
                                </div>

                                <div className="pt-2">
                                    <button onClick={handleSave} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 active:scale-95 transition-transform">
                                        Salvar Lançamento
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FinancasCasalApp />);
    </script>
</body>
</html>
