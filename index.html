<body class="bg-slate-100 text-slate-800 antialiased h-screen overflow-hidden flex items-center justify-center">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdM0kTzE1f-D4RmaxmQ-CDmVXzK5W4748",
            authDomain: "financas-casal-jordanareli.firebaseapp.com",
            projectId: "financas-casal-jordanareli",
            storageBucket: "financas-casal-jordanareli.firebasestorage.app",
            messagingSenderId: "1091820122865",
            appId: "1:1091820122865:web:f0d18cd512fab369182f50"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseAPI = {
            auth: getAuth(app),
            db: getFirestore(app),
            signInAnonymously,
            onAuthStateChanged,
            doc, setDoc, deleteDoc, onSnapshot, collection,
            appId: "1_1091820122865_web_f0d18cd512fab369182f50"
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORIAS = [
            { id: 'cat_moradia', name: 'Moradia', icon: '🏠', color: 'bg-indigo-500' },
            { id: 'cat_contas', name: 'Contas da Casa', icon: '📄', color: 'bg-orange-500' },
            { id: 'cat_mercado', name: 'Mercado', icon: '🛒', color: 'bg-green-500' },
            { id: 'cat_transporte', name: 'Transporte', icon: '🚗', color: 'bg-slate-500' },
            { id: 'cat_saude', name: 'Saúde', icon: '💊', color: 'bg-red-500' },
            { id: 'cat_educacao', name: 'Educação', icon: '📚', color: 'bg-blue-400' },
            { id: 'cat_lazer', name: 'Lazer', icon: '🎉', color: 'bg-yellow-500' },
            { id: 'cat_restaurante', name: 'Restaurantes', icon: '🍽️', color: 'bg-orange-400' },
            { id: 'cat_assinaturas', name: 'Assinaturas', icon: '📺', color: 'bg-purple-500' },
            { id: 'cat_roupas', name: 'Roupas', icon: '👕', color: 'bg-pink-400' },
            { id: 'cat_pets', name: 'Pets', icon: '🐶', color: 'bg-amber-600' },
            { id: 'cat_impostos', name: 'Impostos/Taxas', icon: '🏛', color: 'bg-slate-700' },
            { id: 'cat_salario', name: 'Salário', icon: '💰', color: 'bg-green-600', type: 'income' },
            { id: 'cat_renda_extra', name: 'Renda Extra', icon: '💸', color: 'bg-emerald-500', type: 'income' },
            { id: 'cat_outros', name: 'Outros', icon: '✨', color: 'bg-gray-400' }
        ];

        const INITIAL_ACCOUNTS = [
            { id: 'acc_nup1', ownerId: 'p1', name: 'Nubank Conta', bank: 'Nubank', balance: 150000, type: 'checking', color: 'bg-purple-700' },
            { id: 'acc_nup2', ownerId: 'p2', name: 'Nubank Conta', bank: 'Nubank', balance: 230000, type: 'checking', color: 'bg-purple-700' },
            { id: 'acc_bra', ownerId: 'casal', name: 'Bradesco (CC)', bank: 'Bradesco', balance: 450000, type: 'checking', color: 'bg-red-600' },
            { id: 'acc_cai', ownerId: 'casal', name: 'Caixa', bank: 'Caixa', balance: 1200000, type: 'savings', color: 'bg-blue-600' },
            { id: 'acc_din', ownerId: 'casal', name: 'Carteira', bank: 'Dinheiro', balance: 35000, type: 'cash', color: 'bg-emerald-600' }
        ];

        const INITIAL_CARDS = [
            { id: 'card_nup1', ownerId: 'p1', name: 'Nubank', limit: 500000, closingDay: 25, dueDay: 2, accountId: 'acc_nup1', color: 'bg-purple-700' },
            { id: 'card_nup2', ownerId: 'p2', name: 'Nubank', limit: 800000, closingDay: 20, dueDay: 27, accountId: 'acc_nup2', color: 'bg-purple-700' },
            { id: 'card_bra', ownerId: 'casal', name: 'Bradesco', limit: 1200000, closingDay: 5, dueDay: 12, accountId: 'acc_bra', color: 'bg-red-600' },
            { id: 'card_cai', ownerId: 'casal', name: 'Caixa', limit: 300000, closingDay: 10, dueDay: 17, accountId: 'acc_cai', color: 'bg-blue-600' }
        ];

        const INITIAL_TRANSACTIONS = [
            { id: 't1', type: 'income', amount: 800000, description: 'Salário', date: new Date().toISOString().split('T')[0], categoryId: 'cat_salario', sourceId: 'acc_bra', sourceType: 'account', ownerId: 'p1', status: 'paid' },
            { id: 't2', type: 'expense', amount: 12000, description: 'Luz', date: new Date().toISOString().split('T')[0], categoryId: 'cat_contas', sourceId: 'acc_bra', sourceType: 'account', ownerId: 'casal', splitType: '50/50', paidById: 'p1', status: 'paid' },
            { id: 't3', type: 'expense', amount: 35000, description: 'Supermercado', date: new Date().toISOString().split('T')[0], categoryId: 'cat_mercado', sourceId: 'card_bra', sourceType: 'card', ownerId: 'casal', splitType: '50/50', paidById: 'casal', status: 'pending' },
        ];

        const formatCurrency = (cents) => {
            return (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        const parseCurrencyString = (str) => {
            const digits = str.replace(/\D/g, '');
            return parseInt(digits, 10) || 0;
        };

        const formatDate = (isoString) => {
            if (!isoString) return '';
            const [y, m, d] = isoString.split('-');
            return `${d}/${m}/${y}`;
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const getFaturaCycle = (dateStr, closingDay) => {
            const date = new Date(dateStr + 'T00:00:00');
            let month = date.getMonth() + 1;
            let year = date.getFullYear();
            
            if (date.getDate() > closingDay) {
                month += 1;
                if (month > 12) {
                    month = 1;
                    year += 1;
                }
            }
            return `${year}-${String(month).padStart(2, '0')}`;
        };

        const addMonthsToDateStr = (dateStr, numMonths) => {
            const [y, m, d] = dateStr.split('-').map(Number);
            let targetM = m + numMonths;
            let targetY = y;
            while (targetM > 12) {
                targetM -= 12;
                targetY += 1;
            }
            return `${targetY}-${String(targetM).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        };

        function FinancasCasalApp() {
            const [globalFilter, setGlobalFilter] = useState('casal');
            const [currentTab, setCurrentTab] = useState('home');
            
            const [user, setUser] = useState(null);
            const [accounts, setAccounts] = useState(INITIAL_ACCOUNTS);
            const [cards, setCards] = useState(INITIAL_CARDS);
            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
            
            const [manualInvoices, setManualInvoices] = useState(() => {
                try { return JSON.parse(localStorage.getItem('fc_manual_invoices')) || {}; } catch(e) { return {}; }
            });
            
            const [pessoa1Name, setPessoa1Name] = useState(() => localStorage.getItem('fc_p1_name') || 'Jordan');
            const [pessoa2Name, setPessoa2Name] = useState(() => localStorage.getItem('fc_p2_name') || 'Areli');

            const PESSOA1 = useMemo(() => ({ id: 'p1', name: pessoa1Name, color: 'bg-blue-500', avatar: 'A' }), [pessoa1Name]);
            const PESSOA2 = useMemo(() => ({ id: 'p2', name: pessoa2Name, color: 'bg-pink-500', avatar: 'B' }), [pessoa2Name]);
            const CASAL = useMemo(() => ({ id: 'casal', name: 'Casal', color: 'bg-purple-600', avatar: '👥' }), []);

            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [editingTx, setEditingTx] = useState(null);
            const [editingCard, setEditingCard] = useState(null);
            const [isNewCardModalOpen, setIsNewCardModalOpen] = useState(false);
            const [cardForInvoiceModal, setCardForInvoiceModal] = useState(null);

            const [themeColor, setThemeColor] = useState(() => localStorage.getItem('fc_theme') || 'indigo');
            
            const [authError, setAuthError] = useState(false);
            const [dbError, setDbError] = useState(false);
            const [firebaseReady, setFirebaseReady] = useState(false);

            useEffect(() => {
                const checkFb = setInterval(() => {
                    if (window.firebaseAPI) {
                        clearInterval(checkFb);
                        setFirebaseReady(true);
                        initializeFirebaseAuth(window.firebaseAPI);
                    }
                }, 100);
                return () => clearInterval(checkFb);
            }, []);

            const initializeFirebaseAuth = async (fb) => {
                try {
                    await fb.signInAnonymously(fb.auth);
                    setAuthError(false);
                } catch (error) {
                    if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                        setAuthError(true);
                    }
                }

                fb.onAuthStateChanged(fb.auth, (currentUser) => {
                    setUser(currentUser);
                });
            };

            useEffect(() => {
                if (!user || !window.firebaseAPI) return;
                
                const { db, collection, onSnapshot, appId } = window.firebaseAPI;
                const txRef = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');
                
                const unsubscribe = onSnapshot(txRef, (snapshot) => {
                    setDbError(false);
                    const loadedTxs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (loadedTxs.length > 0) {
                        setTransactions(loadedTxs);
                    }
                }, (error) => {
                    if (error.code === 'permission-denied' || (error.message && error.message.includes('Missing or insufficient permissions'))) {
                        setDbError(true);
                    }
                });
                return () => unsubscribe();
            }, [user, firebaseReady]);

            const [currentViewMonth, setCurrentViewMonth] = useState(() => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            });

            const getOwnerConfig = (id) => [PESSOA1, PESSOA2, CASAL].find(p => p.id === id) || CASAL;
            
            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    const tMonth = t.date.substring(0, 7);
                    if (tMonth !== currentViewMonth) return false;
                    
                    if (globalFilter === 'casal') return true; 
                    return t.ownerId === globalFilter || t.ownerId === 'casal';
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [transactions, globalFilter, currentViewMonth]);

            const dashboardStats = useMemo(() => {
                let income = 0;
                let accountExpense = 0;
                let cardExpense = 0;

                filteredTransactions.forEach(t => {
                    let factor = 1;
                    if (t.ownerId === 'casal' && globalFilter !== 'casal') factor = 0.5;

                    if (t.type === 'income') income += t.amount * factor;
                    if (t.type === 'expense' && t.sourceType === 'account') accountExpense += t.amount * factor;
                    if (t.type === 'expense' && t.sourceType === 'card') cardExpense += t.amount * factor;
                });

                // Soma também o valor das faturas manuais e transações de cartão por ciclo para o mês atual
                cards.forEach(card => {
                    if (globalFilter !== 'casal' && card.ownerId !== globalFilter && card.ownerId !== 'casal') return;

                    let cardTxSum = 0;
                    transactions.forEach(t => {
                        if (t.sourceType === 'card' && t.sourceId === card.id) {
                            const cycle = getFaturaCycle(t.date, card.closingDay);
                            if (cycle === currentViewMonth) cardTxSum += t.amount;
                        }
                    });

                    const manualKey = `${card.id}_${currentViewMonth}`;
                    const manualExtra = manualInvoices[manualKey] || 0;
                    
                    let factor = 1;
                    if (card.ownerId === 'casal' && globalFilter !== 'casal') factor = 0.5;

                    // Se a fatura manual foi preenchida, usamos ela como total do cartão daquele ciclo
                    if (manualExtra > 0) {
                        // Evitamos duplicar se já tem transações de cartão cadastradas ou somamos se for extra
                        cardExpense += manualExtra * factor;
                    }
                });

                const totalExpense = accountExpense + cardExpense;

                return { income, expense: totalExpense, accountExpense, cardExpense, balance: income - totalExpense };
            }, [filteredTransactions, globalFilter, cards, manualInvoices, transactions, currentViewMonth]);

            const acertoDeContas = useMemo(() => {
                let p2OwesP1 = 0; 
                
                transactions.forEach(t => {
                    if (t.date.substring(0, 7) !== currentViewMonth) return;
                    if (t.ownerId !== 'casal' || t.type !== 'expense') return;

                    let payer = t.paidById;
                    if (!payer) {
                        if (t.sourceType === 'account') {
                            const acc = accounts.find(a => a.id === t.sourceId);
                            payer = acc ? acc.ownerId : 'casal';
                        } else if (t.sourceType === 'card') {
                            const card = cards.find(c => c.id === t.sourceId);
                            payer = card ? card.ownerId : 'casal';
                        } else {
                            payer = 'casal';
                        }
                    }

                    if (payer === 'casal') return;

                    const half = Math.round(t.amount / 2);
                    if (payer === 'p1') p2OwesP1 += half;
                    if (payer === 'p2') p2OwesP1 -= half;
                });

                return p2OwesP1;
            }, [transactions, currentViewMonth, accounts, cards]);

            const changeMonth = (offset) => {
                const [y, m] = currentViewMonth.split('-').map(Number);
                let newM = m + offset;
                let newY = y;
                if (newM > 12) { newM = 1; newY++; }
                if (newM < 1) { newM = 12; newY--; }
                setCurrentViewMonth(`${newY}-${String(newM).padStart(2, '0')}`);
            };

            const themeClasses = {
                indigo: { bg: 'bg-indigo-600', hover: 'hover:bg-indigo-700', text: 'text-indigo-600', lightBg: 'bg-indigo-50', shadow: 'shadow-indigo-600/30' },
                emerald: { bg: 'bg-emerald-600', hover: 'hover:bg-emerald-700', text: 'text-emerald-600', lightBg: 'bg-emerald-50', shadow: 'shadow-emerald-600/30' },
                purple: { bg: 'bg-purple-600', hover: 'hover:bg-purple-700', text: 'text-purple-600', lightBg: 'bg-purple-50', shadow: 'shadow-purple-600/30' },
                rose: { bg: 'bg-rose-600', hover: 'hover:bg-rose-700', text: 'text-rose-600', lightBg: 'bg-rose-50', shadow: 'shadow-rose-600/30' },
                amber: { bg: 'bg-amber-600', hover: 'hover:bg-amber-700', text: 'text-amber-600', lightBg: 'bg-amber-50', shadow: 'shadow-amber-600/30' },
            }[themeColor] || { bg: 'bg-indigo-600', hover: 'hover:bg-indigo-700', text: 'text-indigo-600', lightBg: 'bg-indigo-50', shadow: 'shadow-indigo-600/30' };

            const saveTheme = (color) => {
                setThemeColor(color);
                localStorage.setItem('fc_theme', color);
            };

            const handleSaveNames = (n1, n2) => {
                setPessoa1Name(n1);
                setPessoa2Name(n2);
                localStorage.setItem('fc_p1_name', n1);
                localStorage.setItem('fc_p2_name', n2);
            };

            const handleDeleteTransaction = async (txId) => {
                if (!confirm("Tem certeza que deseja excluir este lançamento?")) return;
                if (user && window.firebaseAPI) {
                    try {
                        const { db, doc, deleteDoc, appId } = window.firebaseAPI;
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'transactions', txId));
                    } catch (e) {
                        console.error(e);
                    }
                }
                setTransactions(prev => prev.filter(t => t.id !== txId));
            };

            const handleSaveManualInvoice = (cardId, cycle, amount) => {
                const updated = { ...manualInvoices, [`${cardId}_${cycle}`]: amount };
                setManualInvoices(updated);
                localStorage.setItem('fc_manual_invoices', JSON.stringify(updated));
                setCardForInvoiceModal(null);
            };

            return (
                <div className="w-full max-w-6xl h-full md:h-[92vh] md:rounded-3xl flex flex-col md:flex-row bg-slate-50 font-sans shadow-2xl relative text-slate-800 border border-slate-200 overflow-hidden">
                    
                    {/* Barra Lateral Desktop (Sidebar) */}
                    <div className="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 p-6 justify-between z-20 shrink-0">
                        <div>
                            <div className="flex items-center space-x-3 mb-8">
                                <div className={`w-10 h-10 ${themeClasses.bg} text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md ${themeClasses.shadow}`}>
                                    ❤️
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-900 leading-tight">Finanças Casal</h1>
                                    <p className="text-xs text-slate-400">Gestão a dois</p>
                                </div>
                            </div>

                            <nav className="space-y-1.5">
                                <button onClick={() => setCurrentTab('home')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition-colors ${currentTab === 'home' ? `${themeClasses.lightBg} ${themeClasses.text}` : 'text-slate-600 hover:bg-slate-50'}`}>
                                    <i className="fa-solid fa-house w-5"></i><span>Início</span>
                                </button>
                                <button onClick={() => setCurrentTab('transacoes')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition-colors ${currentTab === 'transacoes' ? `${themeClasses.lightBg} ${themeClasses.text}` : 'text-slate-600 hover:bg-slate-50'}`}>
                                    <i className="fa-solid fa-file-invoice w-5"></i><span>Lançamentos</span>
                                </button>
                                <button onClick={() => setCurrentTab('cartoes')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition-colors ${currentTab === 'cartoes' ? `${themeClasses.lightBg} ${themeClasses.text}` : 'text-slate-600 hover:bg-slate-50'}`}>
                                    <i className="fa-solid fa-credit-card w-5"></i><span>Cartões</span>
                                </button>
                                <button onClick={() => setCurrentTab('ajustes')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-semibold text-sm transition-colors ${currentTab === 'ajustes' ? `${themeClasses.lightBg} ${themeClasses.text}` : 'text-slate-600 hover:bg-slate-50'}`}>
                                    <i className="fa-solid fa-gear w-5"></i><span>Ajustes</span>
                                </button>
                            </nav>
                        </div>

                        <div>
                            <button onClick={() => { setEditingTx(null); setIsTxModalOpen(true); }} className={`w-full ${themeClasses.bg} ${themeClasses.hover} text-white font-bold py-3.5 px-4 rounded-xl shadow-lg ${themeClasses.shadow} flex items-center justify-center space-x-2 transition-transform active:scale-95`}>
                                <i className="fa-solid fa-plus"></i>
                                <span>Novo Lançamento</span>
                            </button>
                        </div>
                    </div>

                    {/* Conteúdo Principal */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        
                        {/* Header Superior */}
                        <div className="bg-white px-6 pt-5 pb-4 border-b border-slate-200 z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold text-slate-900">
                                    Olá, {globalFilter === 'casal' ? 'Casal' : getOwnerConfig(globalFilter).name}!
                                </h1>
                                <p className="text-xs md:text-sm text-slate-500 font-medium">Controle integrado e inteligente</p>
                            </div>

                            <div className="flex items-center justify-between md:justify-end gap-3">
                                {/* Seletor de Perfil (Filtro Global) */}
                                <div className="flex bg-slate-100 p-1 rounded-full space-x-1">
                                    {[PESSOA1, CASAL, PESSOA2].map(p => (
                                        <button
                                            key={p.id}
                                            onClick={() => setGlobalFilter(p.id)}
                                            className={`px-3 py-1.5 rounded-full flex items-center space-x-1.5 text-xs font-bold transition-all ${
                                                globalFilter === p.id 
                                                    ? `${p.color} text-white shadow-md transform scale-105` 
                                                    : 'text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            <span>{p.avatar}</span>
                                            <span className="hidden sm:inline">{p.name}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Seletor de Mês */}
                                <div className="flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                                    <button onClick={() => changeMonth(-1)} className="p-1 text-slate-400 hover:text-slate-800"><i className="fa-solid fa-chevron-left text-xs"></i></button>
                                    <span className="font-semibold text-xs md:text-sm capitalize whitespace-nowrap">
                                        {new Date(currentViewMonth + '-02').toLocaleString('pt-BR', { month: 'short', year: 'numeric' })}
                                    </span>
                                    <button onClick={() => changeMonth(1)} className="p-1 text-slate-400 hover:text-slate-800"><i className="fa-solid fa-chevron-right text-xs"></i></button>
                                </div>
                            </div>
                        </div>

                        {/* Avisos do Sistema */}
                        {(authError || dbError) && (
                            <div className="bg-amber-50 border-b border-amber-200 text-amber-800 px-6 py-2.5 text-xs flex items-center justify-between shrink-0">
                                <span className="flex items-center">
                                    <i className="fa-solid fa-circle-exclamation mr-2 text-base"></i>
                                    {authError ? "Ative o login Anônimo no console do Firebase." : "Verifique as regras de segurança do Firestore no console."}
                                </span>
                            </div>
                        )}

                        {/* Área de Scroll Central */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 pb-28 md:pb-8 hide-scrollbar">
                            <div className="max-w-4xl mx-auto space-y-6">
                                
                                {/* TAB: HOME */}
                                {currentTab === 'home' && (
                                    <div className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {/* Saldo Principal */}

                const owner = getOwnerConfig(t.ownerId);

                return (
                    <div className="flex items-center p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                        <div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-white ${cat.color} shadow-sm shrink-0`}>
                            <span className="text-lg">{cat.icon}</span>
                        </div>
                        
                        <div className="ml-3 flex-1 overflow-hidden">
                            <p className="font-semibold text-slate-800 text-sm truncate">{t.description} {t.installment && <span className="text-xs bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono ml-1">{t.installment}</span>}</p>
                            <div className="flex items-center text-xs text-slate-500 mt-0.5 space-x-2">
                                <span>{formatDate(t.date)}</span>
                                <span>•</span>
                                <span className="truncate">{cat.name}</span>
                            </div>
                        </div>

                        <div className="flex flex-col items-end shrink-0 ml-2">
                            <span className={`font-bold text-sm ${isIncome ? 'text-emerald-600' : 'text-slate-800'}`}>
                                {isIncome ? '+' : '-'}{formatCurrency(t.amount)}
                            </span>
                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold mt-1 ${owner.color} text-white`}>
                                {owner.id === 'p1' ? pessoa1Name : owner.id === 'p2' ? pessoa2Name : owner.name}
                            </span>
                        </div>
                    </div>
                );
            }

            function TransactionModal({ onClose, onSave, accounts, cards, themeClasses, editingTx, pessoa1Name, pessoa2Name }) {
                const [type, setType] = useState(editingTx ? editingTx.type : 'expense');
                const [amountStr, setAmountStr] = useState(editingTx ? (editingTx.amount).toString() : '0,00');
                const [description, setDescription] = useState(editingTx ? editingTx.description : '');
                const [date, setDate] = useState(editingTx ? editingTx.date : new Date().toISOString().split('T')[0]);
                const [categoryId, setCategoryId] = useState(editingTx ? editingTx.categoryId : '');
                const [ownerId, setOwnerId] = useState(editingTx ? editingTx.ownerId : 'casal');
                const [source, setSource] = useState(editingTx ? editingTx.sourceId : '');
                const [installmentsCount, setInstallmentsCount] = useState(1);

                const isExpense = type === 'expense';
                const isIncome = type === 'income';
                const selectedSourceIsCard = cards.some(c => c.id === source);

                useEffect(() => {
                    if (editingTx && editingTx.amount) {
                        const num = editingTx.amount;
                        setAmountStr((num / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                    }
                }, [editingTx]);

                const handleAmountChange = (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    if (val === '') val = '0';
                    const num = parseInt(val, 10);
                    setAmountStr((num / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
                };

                const handleSave = () => {
                    const totalAmount = parseCurrencyString(amountStr);
                    if (totalAmount <= 0 || !description || !categoryId || !source) {
                        alert("Preencha todos os campos obrigatórios"); 
                        return;
                    }

                    const isCard = cards.some(c => c.id === source);

                    if (editingTx) {
                        const updatedTx = {
                            ...editingTx,
                            type,
                            amount: totalAmount,
                            description,
                            date,
                            categoryId,
                            sourceId: source,
                            sourceType: isCard ? 'card' : 'account',
                            ownerId,
                            status: isCard ? 'pending' : 'paid',
                            paidById: ownerId === 'casal' ? (isCard ? cards.find(c=>c.id===source).ownerId : accounts.find(a=>a.id===source)?.ownerId || 'casal') : null
                        };
                        onSave(updatedTx);
                    } else {
                        const count = isCard && installmentsCount > 1 ? parseInt(installmentsCount, 10) : 1;
                        const amountPerInstallment = Math.round(totalAmount / count);
                        const newTxs = [];

                        for (let i = 0; i < count; i++) {
                            const txDate = i === 0 ? date : addMonthsToDateStr(date, i);
                            newTxs.push({
                                id: generateId() + '-' + i,
                                type,
                                amount: amountPerInstallment,
                                description: count > 1 ? `${description} (${i + 1}/${count})` : description,
                                date: txDate,
                                categoryId,
                                sourceId: source,
                                sourceType: isCard ? 'card' : 'account',
                                ownerId,
                                status: isCard ? 'pending' : 'paid',
                                installment: count > 1 ? `${i + 1}/${count}` : null,
                                paidById: ownerId === 'casal' ? (isCard ? cards.find(c=>c.id===source).ownerId : accounts.find(a=>a.id===source)?.ownerId || 'casal') : null
                            });
                        }
                        onSave(newTxs);
                    }
                };

                return (
                    <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                            <div className="flex justify-between items-center p-5 border-b border-slate-100">
                                <h2 className="text-lg font-bold text-slate-800">{editingTx ? 'Editar Lançamento' : 'Novo Lançamento'}</h2>
                                <button onClick={onClose} className="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div className="p-6 overflow-y-auto hide-scrollbar space-y-4">
                                <div className="flex bg-slate-100 p-1 rounded-xl">
                                    <button onClick={() => setType('expense')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${type === 'expense' ? 'bg-white shadow-sm text-red-600' : 'text-slate-500'}`}>Despesa</button>
                                    <button onClick={() => setType('income')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${type === 'income' ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-500'}`}>Receita</button>
                                </div>
                                
                                <div className="text-center py-2">
                                    <label className="text-xs text-slate-400 font-semibold uppercase mb-1 block">Valor Total</label>
                                    <div className="flex items-center justify-center text-3xl md:text-4xl font-bold text-slate-800">
                                        <span className="text-xl mr-1 text-slate-400">R$</span>
                                        <input type="text" inputMode="numeric" value={amountStr} onChange={handleAmountChange} className="bg-transparent border-none text-center outline-none w-full max-w-[220px]"/>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Descrição</label>
                                    <input type="text" placeholder="Ex: Supermercado Mensal" value={description} onChange={e => setDescription(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500"/>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Data</label>
                                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">De quem?</label>
                                        <select value={ownerId} onChange={e => setOwnerId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500 appearance-none">
                                            <option value="casal">Casal (Dividir)</option>
                                            <option value="p1">{pessoa1Name}</option>
                                            <option value="p2">{pessoa2Name}</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Categoria</label>
                                    <select value={categoryId} onChange={e => setCategoryId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500 appearance-none">
                                        <option value="">Selecione...</option>
                                        {CATEGORIAS.filter(c => isIncome ? c.type === 'income' : c.type !== 'income').map(c => (
                                            <option key={c.id} value={c.id}>{c.icon} {c.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">{isExpense ? 'Forma de Pagamento' : 'Onde recebeu?'}</label>
                                    <select value={source} onChange={e => setSource(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500 appearance-none">
                                        <option value="">Selecione...</option>
                                        {isExpense && (
                                            <>
                                                <option value="pix_geral">⚡ PIX</option>
                                                <option value="deb_geral">💳 Débito</option>
                                            </>
                                        )}
                                        <optgroup label="Contas Bancárias">
                                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                        </optgroup>
                                        {isExpense && <optgroup label="Cartões de Crédito">
                                            {cards.map(c => <option key={c.id} value={c.id}>{c.name} ({c.ownerId === 'p1' ? pessoa1Name : c.ownerId === 'p2' ? pessoa2Name : 'Casal'})</option>)}
                                        </optgroup>}
                                    </select>
                                </div>

                                {isExpense && selectedSourceIsCard && !editingTx && (
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Parcelamento</label>
                                        <select value={installmentsCount} onChange={e => setInstallmentsCount(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none focus:border-indigo-500 appearance-none">
                                            {[...Array(12)].map((_, i) => (
                                                <option key={i + 1} value={i + 1}>{i === 0 ? 'À vista (1x)' : `${i + 1}x vezes`}</option>
                                            ))}
                                        </select>
                                    </div>
                                )}

                                <div className="pt-2">
                                    <button onClick={handleSave} className={`w-full ${themeClasses.bg} ${themeClasses.hover} text-white font-bold text-base py-3.5 rounded-xl shadow-lg ${themeClasses.shadow} active:scale-95 transition-transform`}>
                                        Salvar Lançamento
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            function NewCardModal({ onClose, onSave, themeClasses, pessoa1Name, pessoa2Name }) {
                const [name, setName] = useState('');
                const [limitStr, setLimitStr] = useState('1.000,00');
                const [closingDay, setClosingDay] = useState(10);
                const [dueDay, setDueDay] = useState(17);
                const [ownerId, setOwnerId] = useState('casal');
                const [color, setColor] = useState('bg-purple-700');

                const handleLimitChange = (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    if (val === '') val = '0';
                    const num = parseInt(val, 10);
                    setLimitStr((num / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 }));
                };

                const handleSave = () => {
                    if (!name.trim()) {
                        alert("Digite o nome do cartão.");
                        return;
                    }
                    const limit = parseCurrencyString(limitStr);
                    onSave({
                        id: generateId(),
                        name,
                        limit,
                        closingDay: parseInt(closingDay, 10),
                        dueDay: parseInt(dueDay, 10),
                        ownerId,
                        color
                    });
                };

                return (
                    <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                            <div className="flex justify-between items-center p-5 border-b border-slate-100">
                                <h2 className="text-lg font-bold text-slate-800">Novo Cartão de Crédito</h2>
                                <button onClick={onClose} className="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div className="p-6 space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Nome do Cartão</label>
                                    <input type="text" placeholder="Ex: Nubank, Visa Infinite..." value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Limite (R$)</label>
                                    <input type="text" inputMode="numeric" value={limitStr} onChange={handleLimitChange} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Dia Fechamento</label>
                                        <input type="number" min="1" max="31" value={closingDay} onChange={e => setClosingDay(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Dia Vencimento</label>
                                        <input type="number" min="1" max="31" value={dueDay} onChange={e => setDueDay(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">De quem?</label>
                                        <select value={ownerId} onChange={e => setOwnerId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none appearance-none">
                                            <option value="casal">Casal</option>
                                            <option value="p1">{pessoa1Name}</option>
                                            <option value="p2">{pessoa2Name}</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Cor</label>
                                        <select value={color} onChange={e => setColor(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none appearance-none">
                                            <option value="bg-purple-700">Roxo (Nubank)</option>
                                            <option value="bg-red-600">Vermelho</option>
                                            <option value="bg-blue-600">Azul</option>
                                            <option value="bg-slate-900">Preto</option>
                                            <option value="bg-emerald-600">Verde</option>
                                            <option value="bg-amber-600">Laranja/Dourado</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="pt-4">
                                    <button onClick={handleSave} className={`w-full ${themeClasses.bg} ${themeClasses.hover} text-white font-bold py-3.5 rounded-xl shadow-lg transition-transform`}>
                                        Adicionar Cartão
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            function EditCardModal({ card, onClose, onSave, onDelete, themeClasses, pessoa1Name, pessoa2Name }) {
                const [name, setName] = useState(card.name);
                const [limitStr, setLimitStr] = useState((card.limit / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 }));
                const [closingDay, setClosingDay] = useState(card.closingDay);
                const [dueDay, setDueDay] = useState(card.dueDay);
                const [ownerId, setOwnerId] = useState(card.ownerId || 'casal');
                const [color, setColor] = useState(card.color || 'bg-purple-700');

                const handleLimitChange = (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    if (val === '') val = '0';
                    const num = parseInt(val, 10);
                    setLimitStr((num / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 }));
                };

                const handleSave = () => {
                    const limit = parseCurrencyString(limitStr);
                    onSave({
                        ...card,
                        name,
                        limit,
                        closingDay: parseInt(closingDay, 10),
                        dueDay: parseInt(dueDay, 10),
                        ownerId,
                        color
                    });
                };

                return (
                    <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                            <div className="flex justify-between items-center p-5 border-b border-slate-100">
                                <h2 className="text-lg font-bold text-slate-800">Editar Cartão</h2>
                                <button onClick={onClose} className="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div className="p-6 space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Nome do Cartão</label>
                                    <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Limite (R$)</label>
                                    <input type="text" inputMode="numeric" value={limitStr} onChange={handleLimitChange} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Dia Fechamento</label>
                                        <input type="number" min="1" max="31" value={closingDay} onChange={e => setClosingDay(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Dia Vencimento</label>
                                        <input type="number" min="1" max="31" value={dueDay} onChange={e => setDueDay(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none"/>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">De quem?</label>
                                        <select value={ownerId} onChange={e => setOwnerId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none appearance-none">
                                            <option value="casal">Casal</option>
                                            <option value="p1">{pessoa1Name}</option>
                                            <option value="p2">{pessoa2Name}</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Cor</label>
                                        <select value={color} onChange={e => setColor(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 outline-none appearance-none">
                                            <option value="bg-purple-700">Roxo</option>
                                            <option value="bg-red-600">Vermelho</option>
                                            <option value="bg-blue-600">Azul</option>
                                            <option value="bg-slate-900">Preto</option>
                                            <option value="bg-emerald-600">Verde</option>
                                            <option value="bg-amber-600">Laranja/Dourado</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="pt-4 flex space-x-3">
                                    <button onClick={() => onDelete(card.id)} className="flex-1 bg-red-50 text-red-600 hover:bg-red-100 font-bold py-3.5 rounded-xl transition-colors">
                                        Excluir
                                    </button>
                                    <button onClick={handleSave} className={`flex-1 ${themeClasses.bg} ${themeClasses.hover} text-white font-bold py-3.5 rounded-xl shadow-lg transition-transform`}>
                                        Salvar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FinancasCasalApp />);
    </script>
</body>
</html>
